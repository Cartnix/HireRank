paths:
  /admin/users:
    get:
      tags: [Admin]
      operationId: listAdminUsers
      summary: Admin panel — list tenant users
      description: |
        Available only to **administrator**.
        Returns only users of the current tenant (`tenant_id` from JWT).
      parameters:
        - name: role
          in: query
          schema:
            $ref: '../../schemas/user.yaml#/UserRole'
          description: Filter by role
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Tenant user list
          content:
            application/json:
              schema:
                $ref: '../../schemas/user.yaml#/UsersPublic'
        '401':
          description: Unauthorized
        '403':
          description: Only administrator

  /admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Admin]
      operationId: getAdminUserById
      summary: Admin panel — user card
      description: Available only to **administrator**.
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '../../schemas/user.yaml#/User'
        '401':
          description: Unauthorized
        '403':
          description: Only administrator
        '404':
          description: User not found
