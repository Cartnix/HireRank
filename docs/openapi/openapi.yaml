openapi: 3.1.0

info:
  title: HireRank API
  version: 1.0.0
  description: |
    REST API контракт платформы **HireRank** (HIRERANK) с **AIDE** (AI Decision Engine).

    Канон: PASSPORT — AIDE предлагает 2–3 сценария; человек выбирает в Telegram;
    FastMCP исполняет только выбранное действие под `tenant_id` и пишет Outcome в Precedent Memory.
    AI **не** делает auto-hire / auto-reject.

    **Hidden multi-tenancy**: Core (self-hosted) — один enterprise на инстанс;
    `tenant_id` в JWT/БД фиксирован через `TENANT_ID` (env). PostgreSQL RLS фильтрует строки.
    SaaS позже снимет жёсткую привязку без смены схемы.

    **RBAC**: роли `administrator`, `hr`, `manager`, `recruiter`, `candidate`.
    Матрица: [docs/RBAC.md](../RBAC.md).

    **Auth**: Bearer JWT. Получить токен через `POST /auth/login`.

    **Business rules**:

    * кандидат и recruiter загружают резюме; HR создаёт/ведёт вакансии;
    * кандидат после сохранения попадает в пул `unassigned` и публикуется intake-событие для AIDE;
    * AIDE генерирует 2–3 сценария → Telegram HITL → MCP → Outcome;
    * Administrator — админ-панель и управление пользователями; HR — vacancy CRUD;
    * Manager в web — read-only; решение по сценариям — кнопка в Telegram.

servers:
  - url: http://localhost:8000/api/v1
    description: Local dev
  - url: https://api.hirerank.local/v1
    description: On-prem / production

tags:
  - name: Auth
    description: Регистрация, вход, сессия
  - name: Users
    description: Профиль пользователя и управление пользователями (admin)
  - name: Candidates
    description: Кандидаты, анкеты, назначение на вакансию
  - name: Vacancies
    description: Вакансии tenant
  - name: Notifications
    description: Уведомления
  - name: Dashboard
    description: Сводные данные по ролям
  - name: Admin
    description: Админ-панель, управление пользователями и правами доступа
  - name: AIDE
    description: Decision packages, scenarios, HITL accept, precedents / outcomes

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    $ref: './schemas/_index.yaml'

paths:
  # Auth
  /auth/register:
    $ref: './paths/auth.yaml#/paths/~1auth~1register'
  /auth/login:
    $ref: './paths/auth.yaml#/paths/~1auth~1login'
  /auth/logout:
    $ref: './paths/auth.yaml#/paths/~1auth~1logout'
  /auth/me:
    $ref: './paths/auth.yaml#/paths/~1auth~1me'
  /auth/refresh:
    $ref: './paths/auth.yaml#/paths/~1auth~1refresh'

  # Users
  /users/me:
    $ref: './paths/users.yaml#/paths/~1users~1me'
  /users:
    $ref: './paths/users.yaml#/paths/~1users'
  /users/{id}:
    $ref: './paths/users.yaml#/paths/~1users~1{id}'

  # Candidates
  /candidates:
    $ref: './paths/candidates.yaml#/paths/~1candidates'
  /candidates/{id}:
    $ref: './paths/candidates.yaml#/paths/~1candidates~1{id}'
  /candidates/{id}/assign:
    $ref: './paths/candidates.yaml#/paths/~1candidates~1{id}~1assign'
  /candidates/{id}/questionnaire:
    $ref: './paths/candidates.yaml#/paths/~1candidates~1{id}~1questionnaire'

  # Vacancies
  /vacancies:
    $ref: './paths/vacancies.yaml#/paths/~1vacancies'
  /vacancies/{id}:
    $ref: './paths/vacancies.yaml#/paths/~1vacancies~1{id}'

  # Notifications
  /notifications:
    $ref: './paths/notifications.yaml#/paths/~1notifications'
  /notifications/{id}/read:
    $ref: './paths/notifications.yaml#/paths/~1notifications~1{id}~1read'
  /notifications/read-all:
    $ref: './paths/notifications.yaml#/paths/~1notifications~1read-all'

  # Dashboard
  /dashboard:
    $ref: './paths/dashboard.yaml#/paths/~1dashboard'

  # Admin
  /admin/users:
    $ref: './paths/admin.yaml#/paths/~1admin~1users'
  /admin/users/{id}:
    $ref: './paths/admin.yaml#/paths/~1admin~1users~1{id}'

  # AIDE
  /aide/packages:
    $ref: './paths/aide.yaml#/paths/~1aide~1packages'
  /aide/packages/{id}:
    $ref: './paths/aide.yaml#/paths/~1aide~1packages~1{id}'
  /aide/packages/{id}/accept:
    $ref: './paths/aide.yaml#/paths/~1aide~1packages~1{id}~1accept'
  /aide/outcomes:
    $ref: './paths/aide.yaml#/paths/~1aide~1outcomes'
  /aide/precedents:
    $ref: './paths/aide.yaml#/paths/~1aide~1precedents'
