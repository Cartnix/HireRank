openapi: 3.1.0

info:
  title: HireRank API
  version: 1.0.0
  description: |
    **Implemented** REST contract for HireRank (matches FastAPI routes under `/api/v1`).

    Speculative / future paths (notifications, `/admin/*`, automations) live in
    [`future/`](./future/README.md) and are **not** part of this document or FE codegen.

    **Behavioral Source of Truth:** [use-cases/README](../use-cases/README.md).
    **Compliance:** [ATS_COMPLIANCE_RK](../laws/ATS_COMPLIANCE_RK.md), [GDPR](../laws/GDPR.md).
    **RBAC:** [docs/RBAC.md](../RBAC.md).
    **Auth:** HttpOnly cookie session + optional Bearer; CSRF `X-CSRF-Token` on mutating cookie requests.

    **Hidden multi-tenancy:** Core uses fixed `TENANT_ID`; PostgreSQL FORCE RLS.

servers:
  - url: http://localhost:8000/api/v1
    description: Local dev
  - url: https://api.hirerank.local/v1
    description: On-prem / production

tags:
  - name: Auth
    description: Registration, login, session, consent, OAuth
  - name: Users
    description: Profile and administrator user management (`/users*`)
  - name: Candidates
    description: Candidates, questionnaires, assign, resume URL stub
  - name: Vacancies
    description: Vacancy CRUD (administrator writes)
  - name: Dashboard
    description: Role-shaped summary aggregates

security:
  - CookieAuth: []
  - BearerAuth: []

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        HttpOnly access JWT cookie (name may be `__Host-access_token` in prod).
        Mutating requests also require `X-CSRF-Token` matching `csrf_token` cookie.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Dual-mode for scripts/Swagger (`POST /login/access-token`).

  schemas:
    $ref: './schemas/_index.yaml'

paths:
  # Auth
  /auth/register:
    $ref: './paths/auth.yaml#/paths/~1auth~1register'
  /auth/login:
    $ref: './paths/auth.yaml#/paths/~1auth~1login'
  /auth/logout:
    $ref: './paths/auth.yaml#/paths/~1auth~1logout'
  /auth/me:
    $ref: './paths/auth.yaml#/paths/~1auth~1me'
  /auth/check-email:
    $ref: './paths/auth.yaml#/paths/~1auth~1check-email'
  /auth/accept-legal:
    $ref: './paths/auth.yaml#/paths/~1auth~1accept-legal'
  /auth/refresh:
    $ref: './paths/auth.yaml#/paths/~1auth~1refresh'
  /auth/consent:
    $ref: './paths/auth.yaml#/paths/~1auth~1consent'
  /auth/forget-me:
    $ref: './paths/auth.yaml#/paths/~1auth~1forget-me'
  /auth/oauth/{provider}/start:
    $ref: './paths/auth.yaml#/paths/~1auth~1oauth~1{provider}~1start'
  /auth/callback/google:
    $ref: './paths/auth.yaml#/paths/~1auth~1callback~1google'
  /auth/callback/linkedin:
    $ref: './paths/auth.yaml#/paths/~1auth~1callback~1linkedin'

  # Users
  /users/me:
    $ref: './paths/users.yaml#/paths/~1users~1me'
  /users/me/password:
    $ref: './paths/users.yaml#/paths/~1users~1me~1password'
  /users:
    $ref: './paths/users.yaml#/paths/~1users'
  /users/{id}:
    $ref: './paths/users.yaml#/paths/~1users~1{id}'

  # Candidates
  /candidates:
    $ref: './paths/candidates.yaml#/paths/~1candidates'
  /candidates/{id}:
    $ref: './paths/candidates.yaml#/paths/~1candidates~1{id}'
  /candidates/{id}/assign:
    $ref: './paths/candidates.yaml#/paths/~1candidates~1{id}~1assign'
  /candidates/{id}/questionnaire:
    $ref: './paths/candidates.yaml#/paths/~1candidates~1{id}~1questionnaire'
  /candidates/{id}/resume-url:
    $ref: './paths/candidates.yaml#/paths/~1candidates~1{id}~1resume-url'

  # Vacancies
  /vacancies:
    $ref: './paths/vacancies.yaml#/paths/~1vacancies'
  /vacancies/{id}:
    $ref: './paths/vacancies.yaml#/paths/~1vacancies~1{id}'

  # Dashboard
  /dashboard:
    $ref: './paths/dashboard.yaml#/paths/~1dashboard'
