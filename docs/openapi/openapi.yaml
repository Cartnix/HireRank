openapi: 3.1.0

info:
  title: HireRank API
  version: 1.0.0
  description: |
    REST API contract for the **HireRank** (HIRERANK) platform with **HireRank Automation**
    (events + HITL + MCP + Memory — bureaucracy automation).

    **Behavioral Source of Truth:** [use-cases/UC-08](../use-cases/UC-08-automation-hitl-loop.md)
    ([use-cases/README](../use-cases/README.md)).
    **Compliance (strict):** [ATS_COMPLIANCE_RK](../laws/ATS_COMPLIANCE_RK.md) (RK — primary),
    [GDPR](../laws/GDPR.md) (EU / West). Vision: [PASSPORT](../PASSPORT.md).

    Automation proposes 2–3 MCP-backed bureaucracy options; a human chooses in Telegram;
    FastMCP executes only the selected action under `tenant_id` and writes an Outcome
    (option-choice history) to Memory — [MEMORY.md](../MEMORY.md).
    AI does **not** auto-hire / auto-reject. MVP event: `resume.uploaded`; the loop expands over time.

    **Hidden multi-tenancy**: Core (self-hosted) — one enterprise per instance;
    `tenant_id` in JWT/DB is fixed via `TENANT_ID` (env). PostgreSQL RLS filters rows.
    SaaS later removes the hard binding without a schema change.

    **RBAC**: roles `administrator`, `hr`, `manager`, `recruiter`, `candidate`.
    Matrix: [docs/RBAC.md](../RBAC.md).

    **Auth**: HttpOnly Secure cookie session (PyJWT) + optional Bearer for
    non-browser clients. Social login: Google/LinkedIn OAuth for identity only;
    roles/tenant from PostgreSQL. CSRF: `X-CSRF-Token` on mutating cookie requests.
    See [RBAC.md](../RBAC.md), [AUTH_COOKIE_OAUTH.md](../issues/AUTH_COOKIE_OAUTH.md).

    **Business rules**:

    * candidate fills in a questionnaire; HR creates a candidate card from the JSON questionnaire; recruiter remains role-only until a dedicated use case;
    * after save, the candidate enters the `unassigned` pool and `resume.uploaded` is published for Automation;
    * Automation generates 2–3 options → Telegram HITL → MCP → Outcome in Memory ([MEMORY.md](../MEMORY.md));
    * Administrator — admin panel, user management, and vacancy CRUD;
    * Manager in web — read-only; option decisions are made via Telegram button.

servers:
  - url: http://localhost:8000/api/v1
    description: Local dev
  - url: https://api.hirerank.local/v1
    description: On-prem / production

tags:
  - name: Auth
    description: Registration, login, session
  - name: Users
    description: User profile and user management (admin)
  - name: Candidates
    description: Candidates, questionnaires, vacancy assignment
  - name: Vacancies
    description: Tenant vacancies
  - name: Notifications
    description: Notifications
  - name: Dashboard
    description: Role-specific summary data
  - name: Admin
    description: Admin panel, user management and access control
  - name: Automations
    description: Decision packages, HITL options, accept; Outcomes/Memory ([MEMORY.md](../MEMORY.md))

security:
  - CookieAuth: []
  - BearerAuth: []

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        HttpOnly access JWT cookie (name may be `__Host-access_token` in prod).
        Mutating requests also require `X-CSRF-Token` matching `csrf_token` cookie.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Dual-mode for scripts/Swagger (`POST /login/access-token`).

  schemas:
    $ref: './schemas/_index.yaml'

paths:
  # Auth
  /auth/register:
    $ref: './paths/auth.yaml#/paths/~1auth~1register'
  /auth/login:
    $ref: './paths/auth.yaml#/paths/~1auth~1login'
  /auth/logout:
    $ref: './paths/auth.yaml#/paths/~1auth~1logout'
  /auth/me:
    $ref: './paths/auth.yaml#/paths/~1auth~1me'
  /auth/refresh:
    $ref: './paths/auth.yaml#/paths/~1auth~1refresh'
  /auth/consent:
    $ref: './paths/auth.yaml#/paths/~1auth~1consent'
  /auth/forget-me:
    $ref: './paths/auth.yaml#/paths/~1auth~1forget-me'
  /auth/oauth/{provider}/start:
    $ref: './paths/auth.yaml#/paths/~1auth~1oauth~1{provider}~1start'
  /auth/callback/google:
    $ref: './paths/auth.yaml#/paths/~1auth~1callback~1google'
  /auth/callback/linkedin:
    $ref: './paths/auth.yaml#/paths/~1auth~1callback~1linkedin'

  # Users
  /users/me:
    $ref: './paths/users.yaml#/paths/~1users~1me'
  /users:
    $ref: './paths/users.yaml#/paths/~1users'
  /users/{id}:
    $ref: './paths/users.yaml#/paths/~1users~1{id}'

  # Candidates
  /candidates:
    $ref: './paths/candidates.yaml#/paths/~1candidates'
  /candidates/{id}:
    $ref: './paths/candidates.yaml#/paths/~1candidates~1{id}'
  /candidates/{id}/assign:
    $ref: './paths/candidates.yaml#/paths/~1candidates~1{id}~1assign'
  /candidates/{id}/questionnaire:
    $ref: './paths/candidates.yaml#/paths/~1candidates~1{id}~1questionnaire'

  # Vacancies
  /vacancies:
    $ref: './paths/vacancies.yaml#/paths/~1vacancies'
  /vacancies/{id}:
    $ref: './paths/vacancies.yaml#/paths/~1vacancies~1{id}'

  # Notifications
  /notifications:
    $ref: './paths/notifications.yaml#/paths/~1notifications'
  /notifications/{id}/read:
    $ref: './paths/notifications.yaml#/paths/~1notifications~1{id}~1read'
  /notifications/read-all:
    $ref: './paths/notifications.yaml#/paths/~1notifications~1read-all'

  # Dashboard
  /dashboard:
    $ref: './paths/dashboard.yaml#/paths/~1dashboard'

  # Admin
  /admin/users:
    $ref: './paths/admin.yaml#/paths/~1admin~1users'
  /admin/users/{id}:
    $ref: './paths/admin.yaml#/paths/~1admin~1users~1{id}'

  # Automations
  /automations/packages:
    $ref: './paths/automation.yaml#/paths/~1automations~1packages'
  /automations/packages/{id}:
    $ref: './paths/automation.yaml#/paths/~1automations~1packages~1{id}'
  /automations/packages/{id}/accept:
    $ref: './paths/automation.yaml#/paths/~1automations~1packages~1{id}~1accept'
  /automations/outcomes:
    $ref: './paths/automation.yaml#/paths/~1automations~1outcomes'
