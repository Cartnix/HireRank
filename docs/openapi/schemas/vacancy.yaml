# schemas/vacancy.yaml
# DB persistence: table `vacancy` (+ `pipeline_stage`, `application`).
# See docs/ATS_SCHEMA.md. `assigned_candidate_ids` is an API projection of
# active applications — not a denormalized column on vacancy.

VacancyStatus:
  type: string
  enum: [open, closed, draft]
  example: open

PipelineStage:
  type: object
  required: [id, stage_name, sort_order]
  properties:
    id:
      type: string
      format: uuid
    stage_name:
      type: string
      example: Applied
    sort_order:
      type: integer
      example: 0

Vacancy:
  type: object
  required: [id, tenant_id, title, status, created_by]
  properties:
    id:
      type: string
      format: uuid
      example: b2c3d4e5-f6a7-8901-bcde-f23456789012
    tenant_id:
      type: string
      format: uuid
    title:
      type: string
      example: Backend Developer
    department:
      type: string
      nullable: true
      example: Engineering
    description:
      type: string
      nullable: true
      example: |
        Looking for an experienced Backend developer to work on core services.
        Requirements: Python 3.10+, FastAPI, PostgreSQL.
    requirements:
      type: array
      items:
        type: string
      example: [Python, FastAPI, PostgreSQL, 3+ years experience]
    status:
      $ref: '#/VacancyStatus'
    assigned_candidate_ids:
      type: array
      items:
        type: string
        format: uuid
    stages:
      type: array
      items:
        $ref: '#/PipelineStage'
      description: Default pipeline on create — Applied, Screen, Interview, Offer
    created_by:
      type: string
      format: uuid
      description: id of the Administrator who created the vacancy
    created_at:
      type: string
      format: date-time
      nullable: true
    updated_at:
      type: string
      format: date-time
      nullable: true

CreateVacancyRequest:
  type: object
  required: [title]
  additionalProperties: false
  properties:
    title:
      type: string
      example: Backend Developer
    department:
      type: string
      nullable: true
      example: Engineering
    description:
      type: string
      nullable: true
    requirements:
      type: array
      items:
        type: string
    status:
      $ref: '#/VacancyStatus'
      default: draft

UpdateVacancyRequest:
  type: object
  additionalProperties: false
  properties:
    title:
      type: string
    department:
      type: string
      nullable: true
    description:
      type: string
      nullable: true
    requirements:
      type: array
      items:
        type: string
    status:
      $ref: '#/VacancyStatus'

PagedVacancyResponse:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/Vacancy'
    pagination:
      $ref: './common.yaml#/Pagination'
