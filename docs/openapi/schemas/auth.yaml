# schemas/auth.yaml

AuthSession:
  type: object
  required: [token_type, expires_in]
  description: |
    Browser cookie session metadata. Access/refresh JWTs are delivered only via
    HttpOnly Set-Cookie — not in the JSON body.
  properties:
    token_type:
      type: string
      enum: [cookie]
      example: cookie
    expires_in:
      type: integer
      description: Access cookie TTL in seconds
      example: 3600

TokenPair:
  type: object
  required: [access_token, refresh_token, token_type]
  description: |
    Legacy / Swagger form login (`POST /login/access-token`) for non-browser
    clients. Prefer cookie session via `/auth/login` for SPA/SSR.
  properties:
    access_token:
      type: string
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    refresh_token:
      type: string
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    token_type:
      type: string
      enum: [bearer]
      example: bearer
    expires_in:
      type: integer
      description: Access token TTL in seconds
      example: 3600

RegisterRequest:
  type: object
  required: [email, password, role, consent]
  additionalProperties: false
  properties:
    email:
      type: string
      format: email
      example: ivan@mrxcompany.kz
    password:
      type: string
      format: password
      minLength: 8
      example: Str0ngPass!
    role:
      type: string
      enum: [candidate, hr, manager, recruiter]
      description: |
        Administrator is created manually via seed / admin tooling.
        `tenant_id` is not sent — Core injects the singleton TENANT_ID from env.
      example: hr
    first_name:
      type: string
      example: Ivan
    last_name:
      type: string
      example: Petrov
    consent:
      $ref: '#/ConsentGrant'

ConsentGrant:
  type: object
  required: [account_processing, talent_pool, cross_border]
  description: |
    Separated consents (RK §1.4). Defaults must be false / empty — never pre-ticked.
  properties:
    account_processing:
      type: boolean
      description: Required — process PD for HireRank account
      example: true
    talent_pool:
      type: boolean
      description: Optional — keep PD in talent pool / reserve
      example: false
    cross_border:
      type: boolean
      description: Optional — cross-border transfer
      example: false
    cross_border_countries:
      type: array
      items:
        type: string
      description: Required non-empty when cross_border is true
      example: []

ConsentPublic:
  allOf:
    - $ref: '#/ConsentGrant'

OAuthStartRequest:
  type: object
  required: [consent]
  additionalProperties: false
  properties:
    consent:
      $ref: '#/ConsentGrant'

LoginRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
      example: ivan@mrxcompany.kz
    password:
      type: string
      format: password
      example: Str0ngPass!

RefreshRequest:
  type: object
  properties:
    refresh_token:
      type: string
      description: Optional when refresh HttpOnly cookie is present
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
