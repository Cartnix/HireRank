# schemas/auth.yaml

AuthSession:
  type: object
  required: [token_type, expires_in]
  description: |
    Browser cookie session metadata. Access/refresh JWTs are delivered only via
    HttpOnly Set-Cookie — not in the JSON body.
  properties:
    token_type:
      type: string
      enum: [cookie]
      example: cookie
    expires_in:
      type: integer
      description: Access cookie TTL in seconds
      example: 3600

TokenPair:
  type: object
  required: [access_token, refresh_token, token_type]
  description: |
    Legacy / Swagger form login (`POST /login/access-token`) for non-browser
    clients. Prefer cookie session via `/auth/login` for SPA/SSR.
  properties:
    access_token:
      type: string
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    refresh_token:
      type: string
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    token_type:
      type: string
      enum: [bearer]
      example: bearer
    expires_in:
      type: integer
      description: Access token TTL in seconds
      example: 3600

RegisterRequest:
  type: object
  required: [email, password, role]
  properties:
    email:
      type: string
      format: email
      example: ivan@mrxcompany.kz
    password:
      type: string
      format: password
      minLength: 8
      example: Str0ngPass!
    role:
      type: string
      enum: [candidate, hr, manager, recruiter]
      description: |
        Administrator is created manually via seed / admin tooling.
        `tenant_id` is not sent — Core injects the singleton TENANT_ID from env.
      example: hr
    first_name:
      type: string
      example: Ivan
    last_name:
      type: string
      example: Petrov

LoginRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
      example: ivan@mrxcompany.kz
    password:
      type: string
      format: password
      example: Str0ngPass!

RefreshRequest:
  type: object
  properties:
    refresh_token:
      type: string
      description: Optional when refresh HttpOnly cookie is present
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
