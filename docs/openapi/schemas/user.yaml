# schemas/user.yaml

UserRole:
  type: string
  enum: [administrator, hr, manager, recruiter, candidate]
  example: hr

User:
  type: object
  required: [id, tenant_id, email, role, created_at]
  properties:
    id:
      type: string
      format: uuid
      example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    tenant_id:
      type: string
      format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    email:
      type: string
      format: email
      example: ivan@mrxcompany.kz
    role:
      $ref: '#/UserRole'
    first_name:
      type: string
      example: Ivan
    last_name:
      type: string
      example: Petrov
    is_active:
      type: boolean
      example: true
    created_at:
      type: string
      format: date-time
      example: "2025-06-01T10:00:00Z"
    legal_policy_version:
      type: string
      nullable: true
      example: "2026-08-06"
    legal_accepted_at:
      type: string
      format: date-time
      nullable: true
    legal_acceptance_required:
      type: boolean
      description: True when accepted policy version ≠ current LEGAL_POLICY_VERSION
    consent_refresh_required:
      type: boolean
      description: True when account_processing consent missing or expired
    current_legal_policy_version:
      type: string
      example: "2026-08-06"

UpdateUserRequest:
  type: object
  properties:
    first_name:
      type: string
      example: Ivan
    last_name:
      type: string
      example: Petrov
    email:
      type: string
      format: email

ChangePasswordRequest:
  type: object
  required: [old_password, new_password]
  properties:
    old_password:
      type: string
      format: password
    new_password:
      type: string
      format: password
      minLength: 8

PagedUserResponse:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/User'
    pagination:
      $ref: './common.yaml#/Pagination'
