# schemas/user.yaml — aligned to FastAPI UserPublic / UsersPublic / UpdatePassword

UserRole:
  type: string
  enum: [administrator, hr, manager, recruiter, candidate]
  example: hr

User:
  type: object
  required: [id, tenant_id, email, role, is_active]
  properties:
    id:
      type: string
      format: uuid
      example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    tenant_id:
      type: string
      format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    email:
      type: string
      format: email
      example: ivan@mrxcompany.kz
    role:
      $ref: '#/UserRole'
    first_name:
      type: string
      nullable: true
      example: Ivan
    last_name:
      type: string
      nullable: true
      example: Petrov
    is_active:
      type: boolean
      example: true
    created_at:
      type: string
      format: date-time
      nullable: true
      example: "2025-06-01T10:00:00Z"
    legal_policy_version:
      type: string
      nullable: true
      example: "2026-08-06"
    legal_accepted_at:
      type: string
      format: date-time
      nullable: true
    legal_acceptance_required:
      type: boolean
      description: True when accepted policy version ≠ current LEGAL_POLICY_VERSION
    consent_refresh_required:
      type: boolean
      description: True when account_processing consent missing or expired
    current_legal_policy_version:
      type: string
      example: "2026-08-06"

UpdateUserRequest:
  type: object
  description: PATCH /users/me body (UserUpdateMe)
  properties:
    first_name:
      type: string
      nullable: true
    last_name:
      type: string
      nullable: true
    email:
      type: string
      format: email

CreateUserRequest:
  type: object
  description: POST /users/ (administrator). tenant_id is ignored / forced server-side.
  required: [email, role]
  additionalProperties: false
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password
      minLength: 8
      maxLength: 128
      nullable: true
    role:
      $ref: '#/UserRole'
    first_name:
      type: string
      nullable: true
    last_name:
      type: string
      nullable: true
    is_active:
      type: boolean
      default: true

AdminUpdateUserRequest:
  type: object
  description: PATCH /users/{id} (UserUpdate)
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password
      minLength: 8
      maxLength: 128
    is_active:
      type: boolean
    role:
      $ref: '#/UserRole'
    first_name:
      type: string
      nullable: true
    last_name:
      type: string
      nullable: true

ChangePasswordRequest:
  type: object
  description: PATCH /users/me/password (UpdatePassword)
  required: [current_password, new_password]
  properties:
    current_password:
      type: string
      format: password
    new_password:
      type: string
      format: password
      minLength: 8
      maxLength: 128

UsersPublic:
  type: object
  description: GET /users/ response (skip/limit pagination)
  required: [data, count]
  properties:
    data:
      type: array
      items:
        $ref: '#/User'
    count:
      type: integer
      example: 42
