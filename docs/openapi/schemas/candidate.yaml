# schemas/candidate.yaml
# DB persistence: table `candidate`; assignment via `application` join
# (not a stored `assigned_vacancy_id` column). API may project
# `assigned_vacancy_id` from the active application — docs/ATS_SCHEMA.md.

CandidateStatus:
  type: string
  enum: [unassigned, assigned, pending_hitl, action_applied]
  example: unassigned

EducationEntry:
  type: object
  description: One row from the LPK educational institutions table (item 7)
  properties:
    institution:
      type: string
      description: Educational institution name and location
      example: Al-Farabi Kazakh National University, Almaty
    year_from:
      type: string
      description: Year of admission (string — form does not guarantee a number)
      example: "2012"
    year_to:
      type: string
      description: Year of graduation or departure
      example: "2016"
    dropped_at_year:
      type: string
      nullable: true
      description: Year/course left (if did not graduate)
      example: null
    specialty:
      type: string
      description: Specialty studied
      example: Information Systems
    diploma:
      type: string
      description: Qualification and diploma / certificate number
      example: "Bachelor's diploma No. 012345"

Questionnaire:
  type: object
  description: |
    Candidate personnel questionnaire — structure matches the official
    Personal Personnel Record Sheet (LPK, form lpk.html).
    Fields are numbered according to the form items.
  properties:
    # item 1 — Full name
    surname:
      type: string
      description: "item 1 — Surname (form name=surname)"
      example: Seitkali
    first_name:
      type: string
      description: "item 1 — First name (form name=first_name)"
      example: Alibek
    patronymic:
      type: string
      description: "item 1 — Patronymic (form name=patronymic)"
      example: Serikovich
    # item 2 — Gender
    gender:
      type: string
      description: "item 2 — Gender (free-text from form)"
      example: male
    # item 3 — Date of birth
    birth_date:
      type: string
      description: |
        item 3 — Year, day and month of birth.
        Accepted as string: form is free-text; backend normalizes.
      example: "1995-03-15"
    # item 4 — Place of birth
    birth_place:
      type: string
      description: "item 4 — Place of birth (village/city, district, region, republic)"
      example: Almaty, Almaty Region, Kazakhstan
    # items 5–6
    nationality:
      type: string
      description: "item 5 — Nationality (form name=nationality)"
      example: Kazakh
    citizenship:
      type: string
      description: "item 6 — Citizenship (form name=citizenship)"
      example: Kazakhstan
    # item 7 — Education
    education_level:
      type: string
      description: "item 7 — Education level (free-text from form)"
      example: higher
    education:
      type: array
      description: "item 7 — Educational institutions table (up to 4 rows in form)"
      maxItems: 4
      items:
        $ref: '#/EducationEntry'
    # item 8 — Languages
    languages:
      type: string
      description: |
        item 8 — Native language and other languages, proficiency (free-text).
        Form has a single field name=languages.
      example: "Kazakh (native), Russian (fluent), English (read and translate with a dictionary)"
    # item 9 — Academic degree
    academic_degree:
      type: string
      description: "item 9 — Academic degree / academic title"
      example: ""
    # item 10 — Scientific works
    scientific_works:
      type: array
      description: "item 10 — Scientific works and inventions (two rows in form)"
      maxItems: 2
      items:
        type: string
      example: ["", ""]

Candidate:
  type: object
  required: [id, tenant_id, status, created_at]
  properties:
    id:
      type: string
      format: uuid
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    tenant_id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
      description: Linked User (if the candidate registered themselves)
      nullable: true
    status:
      $ref: '#/CandidateStatus'
    email:
      type: string
      format: email
      nullable: true
    resume_url:
      type: string
      nullable: true
      description: Opaque object key or URL (presign via resume-url)
    assigned_vacancy_id:
      type: string
      format: uuid
      nullable: true
    questionnaire:
      $ref: '#/Questionnaire'
    active_package_id:
      type: string
      format: uuid
      nullable: true
      description: Pending or latest Automation decision package (when automation ships)
    created_at:
      type: string
      format: date-time
      nullable: true
    updated_at:
      type: string
      format: date-time
      nullable: true

CreateCandidateRequest:
  type: object
  description: Used by HR Operator to manually create a candidate card
  required: [questionnaire]
  additionalProperties: false
  properties:
    questionnaire:
      $ref: '#/Questionnaire'
    email:
      type: string
      format: email
      nullable: true
    resume_url:
      type: string
      nullable: true

UpdateQuestionnaireRequest:
  type: object
  required: [questionnaire]
  additionalProperties: false
  properties:
    questionnaire:
      $ref: '#/Questionnaire'

AssignCandidateRequest:
  type: object
  required: [vacancy_id]
  additionalProperties: false
  properties:
    vacancy_id:
      type: string
      format: uuid
      example: b2c3d4e5-f6a7-8901-bcde-f23456789012

ResumeUrlResponse:
  type: object
  required: [url, expires_in]
  properties:
    url:
      type: string
      description: Short-lived opaque/presigned URL (stub until real S3)
      example: https://presign.local/candidates/a1b2/resume?exp=900
    expires_in:
      type: integer
      description: Seconds until URL expires
      example: 900

PagedCandidateResponse:
  type: object
  required: [items, pagination]
  properties:
    items:
      type: array
      items:
        $ref: '#/Candidate'
    pagination:
      $ref: './common.yaml#/Pagination'
