# schemas/dashboard.yaml

AdminDashboard:
  type: object
  properties:
    total_candidates:
      type: integer
      example: 34
    unassigned_candidates:
      type: integer
      example: 12
    pending_hitl:
      type: integer
      example: 4
      description: Кандидаты / packages в ожидании Telegram HITL
    total_vacancies:
      type: integer
      example: 8
    open_vacancies:
      type: integer
      example: 5
    total_users:
      type: integer
      example: 15
    unread_notifications:
      type: integer
      example: 3
    recent_pending_packages:
      type: array
      description: Недавние pending AIDE packages (не rank-score)
      items:
        type: object
        properties:
          package_id:
            type: string
            format: uuid
          candidate_id:
            type: string
            format: uuid
          full_name:
            type: string
            example: Алибек Сейткали
          scenario_count:
            type: integer
            example: 3

HRDashboard:
  type: object
  properties:
    candidates_created_by_me:
      type: integer
      example: 7
    total_candidates:
      type: integer
      example: 34
    open_vacancies:
      type: integer
      example: 5
    unread_notifications:
      type: integer
      example: 2

ManagerDashboard:
  type: object
  properties:
    assigned_candidates:
      type: integer
      example: 4
    pending_hitl:
      type: integer
      example: 2
    open_vacancies:
      type: integer
      example: 5
    unread_notifications:
      type: integer
      example: 1

CandidateDashboard:
  type: object
  properties:
    questionnaire_filled:
      type: boolean
      example: true
    status:
      type: string
      enum: [unassigned, assigned, pending_hitl, action_applied]
      example: unassigned
    assigned_vacancy:
      nullable: true
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Backend Developer

DashboardResponse:
  oneOf:
    - $ref: '#/AdminDashboard'
    - $ref: '#/HRDashboard'
    - $ref: '#/ManagerDashboard'
    - $ref: '#/CandidateDashboard'
  discriminator:
    propertyName: role
