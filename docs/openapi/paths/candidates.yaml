# paths/candidates.yaml

paths:
  /candidates:
    get:
      tags: [Candidates]
      operationId: listCandidates
      summary: List tenant candidates
      description: |
        Available to: **administrator**, **hr**, **manager**.

        Sorted by `created_at` (newest first). Decision product artifact — Automation options /
        Outcomes in Memory ([MEMORY.md](../../MEMORY.md)), not ai_score.

        Manager sees only candidates assigned to vacancies, plus pending HITL for their tenant.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '../schemas/candidate.yaml#/CandidateStatus'
          description: Filter by status
        - name: vacancy_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by vacancy
        - name: search
          in: query
          schema:
            type: string
          description: Search by full name or job title
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated candidate list
          content:
            application/json:
              schema:
                $ref: '../schemas/candidate.yaml#/PagedCandidateResponse'
        '401':
          description: Unauthorized
        '403':
          description: Insufficient permissions

    post:
      tags: [Candidates]
      operationId: createCandidate
      summary: Create candidate card from JSON questionnaire
      description: |
        Used by **hr** to manually create a candidate from a personnel questionnaire JSON.
        After creation the candidate enters the tenant pool with status `unassigned`.
        Publishes `resume.uploaded` for Automation; notifications are created. Auto-ranking/score is not started.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/candidate.yaml#/CreateCandidateRequest'
      responses:
        '201':
          description: Candidate created; `resume.uploaded` queued for Automation
          content:
            application/json:
              schema:
                $ref: '../schemas/candidate.yaml#/Candidate'
        '400':
          description: Questionnaire validation error
        '403':
          description: Only hr or administrator

  /candidates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Candidates]
      operationId: getCandidateById
      summary: Candidate card
      description: |
        Candidate sees only their own card.
        HR Operator, Manager, Administrator see any candidate in their tenant.
      responses:
        '200':
          description: Candidate card
          content:
            application/json:
              schema:
                $ref: '../schemas/candidate.yaml#/Candidate'
        '403':
          description: Access denied
        '404':
          description: Candidate not found

    patch:
      tags: [Candidates]
      operationId: updateCandidate
      summary: Update candidate card
      description: |
        Candidate may update their questionnaire until assignment / action_applied.
        HR Operator may edit any card.
        After a substantial update, a repeat `resume.uploaded` may be published for Automation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/candidate.yaml#/UpdateQuestionnaireRequest'
      responses:
        '200':
          description: Card updated
          content:
            application/json:
              schema:
                $ref: '../schemas/candidate.yaml#/Candidate'
        '403':
          description: Access denied
        '404':
          description: Candidate not found

    delete:
      tags: [Candidates]
      operationId: deleteCandidate
      summary: Delete candidate
      description: Available only to **administrator**.
      responses:
        '204':
          description: Candidate deleted
        '403':
          description: Only administrator
        '404':
          description: Candidate not found

  /candidates/{id}/assign:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [Candidates]
      operationId: assignCandidate
      summary: Assign candidate to vacancy
      description: |
        Available only to **administrator** (manual path UC-04).
        MCP / HITL accept path is deferred (see `docs/openapi/future/` + UC-08).

        After assignment the candidate status becomes `assigned`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/candidate.yaml#/AssignCandidateRequest'
      responses:
        '200':
          description: Candidate assigned to vacancy
          content:
            application/json:
              schema:
                $ref: '../schemas/candidate.yaml#/Candidate'
        '403':
          description: Only administrator
        '404':
          description: Candidate or vacancy not found
        '409':
          description: Candidate already assigned to this vacancy

  /candidates/{id}/questionnaire:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Candidates]
      operationId: getQuestionnaire
      summary: Get candidate questionnaire
      responses:
        '200':
          description: Candidate questionnaire
          content:
            application/json:
              schema:
                $ref: '../schemas/candidate.yaml#/Questionnaire'
        '403':
          description: Access denied
        '404':
          description: Questionnaire not found

    put:
      tags: [Candidates]
      operationId: updateQuestionnaire
      summary: Fill or update candidate JSON questionnaire
      description: |
        Candidate submits the personnel questionnaire JSON form from the frontend.
        On first fill — the candidate enters the `unassigned` pool
        and `resume.uploaded` is published for Automation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/candidate.yaml#/UpdateQuestionnaireRequest'
      responses:
        '200':
          description: Questionnaire saved
          content:
            application/json:
              schema:
                $ref: '../schemas/candidate.yaml#/Candidate'
        '403':
          description: Access denied (not questionnaire owner or status does not allow)
        '404':
          description: Candidate not found

  /candidates/{id}/resume-url:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Candidates]
      operationId: getCandidateResumeUrl
      summary: Presigned / opaque resume URL (RLS-gated)
      description: |
        Loads the candidate under the RLS session first.
        Invisible / foreign IDs return **404**. Then returns a stub short-lived URL
        (real S3 deferred).
      responses:
        '200':
          description: Resume URL
          content:
            application/json:
              schema:
                $ref: '../schemas/candidate.yaml#/ResumeUrlResponse'
        '401':
          description: Unauthorized
        '403':
          description: Insufficient permissions
        '404':
          description: Candidate not visible under current tenant
