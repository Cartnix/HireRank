# paths/automation.yaml

paths:
  /automations/packages:
    get:
      tags: [Automations]
      operationId: listDecisionPackages
      summary: Список decision packages tenant
      description: |
        Пакеты HITL-опций, созданные Automation после `resume.uploaded`.
        Доступ: **administrator**, **hr**, **manager** (manager — read).
      parameters:
        - name: status
          in: query
          schema:
            $ref: '../schemas/automation.yaml#/DecisionPackageStatus'
        - name: candidate_id
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Список packages
          content:
            application/json:
              schema:
                $ref: '../schemas/automation.yaml#/PagedDecisionPackageResponse'
        '401':
          description: Не авторизован

  /automations/packages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Automations]
      operationId: getDecisionPackage
      summary: Карточка decision package
      responses:
        '200':
          description: Package
          content:
            application/json:
              schema:
                $ref: '../schemas/automation.yaml#/DecisionPackage'
        '404':
          description: Не найден

  /automations/packages/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Automations]
      operationId: acceptDecisionPackage
      summary: Принять HITL-опцию (Telegram callback → API)
      description: |
        Человек выбирает одну опцию. FastMCP исполняет **только** выбранный MCP tool под `tenant_id`.
        Пишется Outcome (история выбора опции) в Memory — [MEMORY.md](../../MEMORY.md).
        Без human pick исполнение запрещено.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/automation.yaml#/AcceptScenarioRequest'
      responses:
        '200':
          description: Опция принята, MCP выполнен
          content:
            application/json:
              schema:
                $ref: '../schemas/automation.yaml#/AcceptScenarioResponse'
        '400':
          description: Package не в pending_hitl или невалидный scenario_id
        '403':
          description: Недостаточно прав
        '404':
          description: Package не найден

  /automations/outcomes:
    get:
      tags: [Automations]
      operationId: listOutcomes
      summary: Список Outcomes tenant (Memory)
      description: |
        Outcome = запись о выборе HITL-опции. Канон продукта: [MEMORY.md](../../MEMORY.md).
      parameters:
        - name: candidate_id
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Список Outcomes
          content:
            application/json:
              schema:
                $ref: '../schemas/automation.yaml#/PagedOutcomeResponse'
        '401':
          description: Не авторизован

  /automations/precedents:
    get:
      tags: [Automations]
      operationId: listPrecedents
      summary: Memory tenant (decision + run history)
      description: |
        API path may still say `precedents`; product name is **Memory** — [MEMORY.md](../../MEMORY.md)
        (Outcomes + other Automation run memory; storage TBD).
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Список Precedents
          content:
            application/json:
              schema:
                $ref: '../schemas/automation.yaml#/PagedPrecedentResponse'
        '401':
          description: Не авторизован
