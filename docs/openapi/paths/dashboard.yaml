# paths/dashboard.yaml

paths:
  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Home dashboard — payload depends on user role
      description: |
        Single endpoint; response shape depends on `role` in JWT:

        | Role | Response type |
        |------|-----------|
        | `administrator` | `AdminDashboard` |
        | `hr` | `HRDashboard` |
        | `manager` | `ManagerDashboard` |
        | `candidate` | `CandidateDashboard` |
      responses:
        '200':
          description: Dashboard data for the current role
          content:
            application/json:
              schema:
                $ref: '../schemas/dashboard.yaml#/DashboardResponse'
              examples:
                administrator:
                  summary: Response for Administrator
                  value:
                    total_candidates: 34
                    unassigned_candidates: 12
                    pending_hitl: 4
                    total_vacancies: 8
                    open_vacancies: 5
                    total_users: 15
                    unread_notifications: 3
                    recent_pending_packages:
                      - package_id: c1d2e3f4-a5b6-7890-abcd-ef1234567890
                        candidate_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        full_name: Alibek Seitkali
                        scenario_count: 3
                hr:
                  summary: Response for HR
                  value:
                    candidates_created_by_me: 7
                    total_candidates: 34
                    open_vacancies: 5
                    unread_notifications: 2
                manager:
                  summary: Response for Manager
                  value:
                    assigned_candidates: 4
                    pending_hitl: 2
                    open_vacancies: 5
                    unread_notifications: 1
                candidate:
                  summary: Response for Candidate
                  value:
                    questionnaire_filled: true
                    status: unassigned
                    assigned_vacancy: null
        '401':
          description: Unauthorized
