# paths/users.yaml

paths:
  /users/me:
    get:
      tags: [Users]
      operationId: getMyProfile
      summary: Get own profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/User'
        '401':
          description: Unauthorized

    patch:
      tags: [Users]
      operationId: updateMyProfile
      summary: Update own profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/user.yaml#/UpdateUserRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/User'
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List tenant users
      description: |
        Available only to **administrator**.
        Returns only users of the current tenant (`tenant_id` from JWT).
      parameters:
        - name: role
          in: query
          schema:
            $ref: '../schemas/user.yaml#/UserRole'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/PagedUserResponse'
        '403':
          description: Insufficient permissions

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Users]
      operationId: getUserById
      summary: Get user by ID
      description: Available only to **administrator**.
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '../schemas/user.yaml#/User'
        '403':
          description: Insufficient permissions
        '404':
          description: User not found
