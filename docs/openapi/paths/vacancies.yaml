# paths/vacancies.yaml

paths:
  /vacancies:
    get:
      tags: [Vacancies]
      operationId: listVacancies
      summary: List tenant vacancies
      description: |
        Available to all authenticated tenant users.
        Manager and HR Operator see only vacancies for their `tenant_id`.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '../schemas/vacancy.yaml#/VacancyStatus'
          description: Filter by status
        - name: search
          in: query
          schema:
            type: string
          description: Search by title or department
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Vacancy list
          content:
            application/json:
              schema:
                $ref: '../schemas/vacancy.yaml#/PagedVacancyResponse'
        '401':
          description: Unauthorized

    post:
      tags: [Vacancies]
      operationId: createVacancy
      summary: Create vacancy
      description: Available only to **administrator**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/vacancy.yaml#/CreateVacancyRequest'
      responses:
        '201':
          description: Vacancy created
          content:
            application/json:
              schema:
                $ref: '../schemas/vacancy.yaml#/Vacancy'
        '400':
          description: Validation error
        '403':
          description: Only administrator

  /vacancies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Vacancies]
      operationId: getVacancyById
      summary: Vacancy card
      description: |
        Available to all authenticated tenant users.
        Tenant isolation enforced by `tenant_id`.
      responses:
        '200':
          description: Vacancy found
          content:
            application/json:
              schema:
                $ref: '../schemas/vacancy.yaml#/Vacancy'
        '404':
          description: Vacancy not found

    patch:
      tags: [Vacancies]
      operationId: updateVacancy
      summary: Update vacancy
      description: Available only to **administrator**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/vacancy.yaml#/UpdateVacancyRequest'
      responses:
        '200':
          description: Vacancy updated
          content:
            application/json:
              schema:
                $ref: '../schemas/vacancy.yaml#/Vacancy'
        '403':
          description: Only administrator
        '404':
          description: Vacancy not found

    delete:
      tags: [Vacancies]
      operationId: deleteVacancy
      summary: Delete vacancy
      description: Available only to **administrator**.
      responses:
        '204':
          description: Vacancy deleted
        '403':
          description: Only administrator
        '404':
          description: Vacancy not found
        '409':
          description: Cannot delete vacancy with assigned candidates
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/ErrorResponse'
              example:
                code: VACANCY_HAS_CANDIDATES
                message: Cannot delete vacancy with assigned candidates
