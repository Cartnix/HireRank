# paths/aide.yaml

paths:
  /aide/packages:
    get:
      tags: [AIDE]
      operationId: listDecisionPackages
      summary: Список decision packages (сценарии AIDE)
      description: |
        Доступно: **administrator**, **manager**, **hr_operator**.
        Только пакеты текущего `tenant_id`. Manager видит pending HITL своего tenant.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '../schemas/aide.yaml#/DecisionPackageStatus'
        - name: candidate_id
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Список packages
          content:
            application/json:
              schema:
                $ref: '../schemas/aide.yaml#/PagedDecisionPackageResponse'
        '401':
          description: Не авторизован
        '403':
          description: Недостаточно прав

  /aide/packages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [AIDE]
      operationId: getDecisionPackage
      summary: Получить decision package со сценариями
      responses:
        '200':
          description: Package найден
          content:
            application/json:
              schema:
                $ref: '../schemas/aide.yaml#/DecisionPackage'
        '404':
          description: Не найден в текущем tenant

  /aide/packages/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [AIDE]
      operationId: acceptScenario
      summary: Принять выбранный сценарий (HITL)
      description: |
        Вызывается после нажатия кнопки в Telegram (или эквивалентного HITL callback).
        Система исполняет **только** выбранный сценарий через FastMCP под `tenant_id`
        и пишет Outcome в Precedent Memory. Auto-hire/reject без этого шага запрещён.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/aide.yaml#/AcceptScenarioRequest'
      responses:
        '200':
          description: Сценарий принят, MCP выполнен, Outcome записан
          content:
            application/json:
              schema:
                $ref: '../schemas/aide.yaml#/AcceptScenarioResponse'
        '409':
          description: Package уже resolved или scenario_id не из пакета
        '404':
          description: Package не найден

  /aide/outcomes:
    get:
      tags: [AIDE]
      operationId: listOutcomes
      summary: Outcomes tenant (audit выбранных действий)
      parameters:
        - name: candidate_id
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Список outcomes
          content:
            application/json:
              schema:
                $ref: '../schemas/aide.yaml#/PagedOutcomeResponse'

  /aide/precedents:
    get:
      tags: [AIDE]
      operationId: listPrecedents
      summary: Precedent Memory tenant (чтение)
      description: |
        Записи, которые AIDE использует при генерации сценариев.
        Запись происходит только через Outcome после MCP (не произвольный write с клиента).
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Precedent Memory
          content:
            application/json:
              schema:
                $ref: '../schemas/aide.yaml#/PagedPrecedentResponse'
