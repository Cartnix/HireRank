services:
  backend:
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8000/api/v1/utils/health-check/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    ports:
      - "3000:3000"
    build:
      target: dev
    # Explicit bind — reliable for published ports in CI
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      # GH Actions / Docker often have broken IPv6; next/font/google then 500s on first compile
      - NODE_OPTIONS=--dns-result-order=ipv4first
      # Runtime NEXT_PUBLIC_* (dev target does not bake build-args into the image)
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://placeholder.supabase.co}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder}
    # Process liveness only — page-level 200 is asserted by the workflow curl loop
    # (avoids marking the container unhealthy during Next first-compile)
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null --timeout=5 http://127.0.0.1:3000/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

networks:
  traefik-public:
    external: false
