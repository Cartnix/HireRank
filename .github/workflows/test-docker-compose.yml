name: Test Docker Compose

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

jobs:

  test-docker-compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PORT: 5432
      DOMAIN: localhost
      ENVIRONMENT: local

      STACK_NAME: ${{ secrets.STACK_NAME }}
      PROJECT_NAME: ${{ secrets.PROJECT_NAME }}

      BACKEND_CORS_ORIGINS: ${{ secrets.BACKEND_CORS_ORIGINS }}
      EMAILS_FROM_EMAIL: noreply@example.com

      FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
      FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}

      POSTGRES_SERVER: ${{ secrets.POSTGRES_SERVER }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_N8N_DB: n8n
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}

      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ci-redis-password

      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET_NAME: hirerank-ci

      N8N_ENCRYPTION_KEY: ci-n8n-encryption-key
      N8N_USER_MANAGEMENT_JWT_SECRET: ci-n8n-jwt-secret
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem

      DOCKER_IMAGE_BACKEND: ${{ secrets.DOCKER_IMAGE_BACKEND }}
      DOCKER_IMAGE_FRONTEND: ${{ secrets.DOCKER_IMAGE_FRONTEND }}

      SENTRY_DSN: ""

      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      COMPOSE_FILE: compose.yml:compose.ci.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # n8n services declare env_file: .env (required); provide a CI stub
      - name: Create .env for compose
        run: cp .env.example .env
      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait backend frontend adminer
      - name: Test backend is up
        run: curl --fail --show-error --retry 5 --retry-delay 2 http://127.0.0.1:8000/api/v1/utils/health-check/
      - name: Test frontend is up
        run: |
          curl --fail --show-error --retry 5 --retry-delay 2 \
            --write-out "\nhttp_code=%{http_code}\n" \
            http://127.0.0.1:3000/
      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs frontend --tail 200 || true
          docker compose logs backend --tail 100 || true
      - run: docker compose down -v --remove-orphans
        if: always()
