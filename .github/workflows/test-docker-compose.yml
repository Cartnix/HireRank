name: Test Docker Compose

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

jobs:

  test-docker-compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PORT: 5432
      DOMAIN: localhost
      ENVIRONMENT: local

      STACK_NAME: ${{ secrets.STACK_NAME }}
      PROJECT_NAME: ${{ secrets.PROJECT_NAME }}

      BACKEND_CORS_ORIGINS: ${{ secrets.BACKEND_CORS_ORIGINS }}
      EMAILS_FROM_EMAIL: noreply@example.com

      FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
      FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}

      POSTGRES_SERVER: ${{ secrets.POSTGRES_SERVER }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_N8N_DB: n8n
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}

      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ci-redis-password

      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET_NAME: hirerank-ci

      N8N_ENCRYPTION_KEY: ci-n8n-encryption-key
      N8N_USER_MANAGEMENT_JWT_SECRET: ci-n8n-jwt-secret
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem

      DOCKER_IMAGE_BACKEND: ${{ secrets.DOCKER_IMAGE_BACKEND }}
      DOCKER_IMAGE_FRONTEND: ${{ secrets.DOCKER_IMAGE_FRONTEND }}

      SENTRY_DSN: ""

      NEXT_PUBLIC_API_URL: http://localhost:8000
      COMPOSE_FILE: compose.yml:compose.ci.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # n8n services declare env_file: .env (required); provide a CI stub
      - name: Create .env for compose
        run: cp .env.example .env
      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      # Do not use --wait: Next first-compile can exceed compose wait while still starting
      - run: docker compose up -d backend frontend adminer
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/utils/health-check/; then
              echo "backend healthy"
              exit 0
            fi
            echo "backend not ready ($i/30)"
            sleep 2
          done
          echo "Backend did not become healthy in time"
          exit 1
      - name: Wait for frontend health
        run: |
          for i in $(seq 1 45); do
            code=$(curl -sS -o /tmp/frontend-body.html -w "%{http_code}" http://127.0.0.1:3000/ || echo "000")
            echo "frontend attempt $i/45 http_code=$code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become healthy in time"
          exit 1
      - name: Dump compose diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker inspect "$(docker compose ps -q backend)" --format '{{json .State.Health}}' || true
          docker inspect "$(docker compose ps -q frontend)" --format '{{json .State.Health}}' || true
          docker compose logs frontend --tail 200 || true
          docker compose logs backend --tail 100 || true
          head -c 2000 /tmp/frontend-body.html || true
      - run: docker compose down -v --remove-orphans
        if: always()
